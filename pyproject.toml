[project]
name = "career-scout-au"
version = "0.1.0"
description = "Evidence-aware Australian job discovery and ranking companion to Career Operator AU"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "requests>=2.32,<3",
]

[project.scripts]
career-scout = "career_scout.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
